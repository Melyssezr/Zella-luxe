services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zella
      POSTGRES_PASSWORD: zella
      POSTGRES_DB: zellaluxe
    ports:
      - "5432:5432"
    volumes:
      - zella_pgdata:/var/lib/postgresql/data

volumes:
  zella_pgdata:
