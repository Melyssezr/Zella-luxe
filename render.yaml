# DEPRECATED — Do not use. Zella Luxe is deployed on Vercel + Neon + Cloudinary.
# See DEPLOY-VERCEL.md for the current deployment guide.
#
# This file is kept for reference only.

databases:
  - name: zella-db
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: zella-luxe
    runtime: node
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm start
    disk:
      name: zella-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zella-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
